# Render Blueprint for the FastAPI backend (the frontend is deployed on Vercel).
services:
  - type: web
    name: zoom-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        sync: false # set to your Vercel URL, e.g. https://zoom-clone.vercel.app
      - key: CORS_ORIGIN_REGEX
        sync: false
